[package]
name = "meshelf-identity"
description = "Per-installation signing identity and credential-store boundary for meshelf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
dirs.workspace = true
ed25519-dalek.workspace = true
meshelf-core = { path = "../meshelf-core" }
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-dpapi.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
