name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test -p meshelf-core -p meshelf-protocol -p meshelf-store -p meshelf-tailscale -p meshelf-net
      - run: cargo clippy -p meshelf-core -p meshelf-protocol -p meshelf-store -p meshelf-tailscale -p meshelf-net --all-targets -- -D warnings

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libxkbcommon-dev libgl1-mesa-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libx11-dev libxtst-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p meshelf-desktop
      - run: cargo clippy -p meshelf-platform -p meshelf-desktop --all-targets -- -D warnings
