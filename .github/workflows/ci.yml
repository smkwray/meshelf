name: temporary-openalex-probe

on:
  push:

permissions:
  contents: read

jobs:
  openalex-probe:
    if: github.ref == 'refs/heads/tmp/openalex-bibliometric-refresh-20260909'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OpenAlex registry candidates
        run: python3 tmp/openalex_probe_artifact.py
      - name: Upload audited probe
        uses: actions/upload-artifact@v4
        with:
          name: openalex-probe
          path: tmp/openalex_probe_artifact.json
          if-no-files-found: error
