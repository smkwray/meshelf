name: temporary-openalex-discovery2

on:
  push:

permissions:
  contents: read

jobs:
  openalex-discovery2:
    if: github.ref == 'refs/heads/tmp/openalex-bibliometric-refresh-20260909'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch additional OpenAlex registry evidence
        run: python3 tmp/openalex_discovery2.py
      - name: Upload audited discovery
        uses: actions/upload-artifact@v4
        with:
          name: openalex-discovery2
          path: tmp/openalex_discovery2.json
          if-no-files-found: error
